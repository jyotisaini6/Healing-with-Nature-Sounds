<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stress Level Checker</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background: linear-gradient(to right, #dff6ff, #f7fbff);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:900px;
      background:white;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    .header{
      background:#0077b6;
      color:white;
      text-align:center;
      padding:30px;
    }

    .header h1{
      font-size:40px;
      margin-bottom:10px;
    }

    .header p{
      font-size:18px;
    }

    .content{
      padding:40px;
    }

    .question{
      margin-bottom:25px;
    }

    .question h3{
      margin-bottom:10px;
      color:#023047;
    }

    select{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:1px solid #ccc;
      font-size:16px;
    }

    button{
      width:100%;
      padding:15px;
      background:#0096c7;
      color:white;
      border:none;
      border-radius:12px;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
      margin-top:20px;
    }

    button:hover{
      background:#0077b6;
    }

    .result{
      margin-top:35px;
      padding:25px;
      border-radius:15px;
      background:#f1f9ff;
      display:none;
    }

    .result h2{
      margin-bottom:15px;
      color:#023047;
    }

    .animal-card{
      display:flex;
      gap:20px;
      align-items:center;
      margin-top:20px;
      flex-wrap:wrap;
    }

    .animal-card img{
      width:220px;
      border-radius:15px;
      box-shadow:0 5px 15px rgba(0,0,0,0.2);
    }

    .animal-info{
      flex:1;
    }

    .animal-info h3{
      color:#0077b6;
      margin-bottom:10px;
    }

    .animal-info p{
      line-height:1.6;
      color:#444;
    }

    audio{
      margin-top:15px;
      width:100%;
    }

    .footer{
      text-align:center;
      padding:20px;
      background:#eaf7ff;
      color:#555;
      font-size:14px;
    }

    @media(max-width:768px){
      .header h1{
        font-size:30px;
      }

      .animal-card{
        flex-direction:column;
      }

      .animal-card img{
        width:100%;
      }
    }

  </style>
</head>
<body>

  <div class="container">

    <div class="header">
      <h1>Human Stress Level Checker</h1>
      <p>Find your stress level and discover relaxing animal sounds</p>
    </div>

    <div class="content">

      <div class="question">
        <h3>1. How tired do you feel today?</h3>
        <select id="q1">
          <option value="0">Select</option>
          <option value="1">Not tired</option>
          <option value="2">A little tired</option>
          <option value="3">Very tired</option>
        </select>
      </div>

      <div class="question">
        <h3>2. How stressed are you feeling?</h3>
        <select id="q2">
          <option value="0">Select</option>
          <option value="1">Relaxed</option>
          <option value="2">Sometimes stressed</option>
          <option value="3">Highly stressed</option>
        </select>
      </div>

      <div class="question">
        <h3>3. Are you sleeping properly?</h3>
        <select id="q3">
          <option value="0">Select</option>
          <option value="1">Yes</option>
          <option value="2">Sometimes</option>
          <option value="3">No</option>
        </select>
      </div>

      <button onclick="checkStress()">Check Stress Level</button>

      <div class="result" id="result">

        <h2 id="stressText"></h2>

        <div class="animal-card">
          <img id="animalImg" src="" alt="Animal">

          <div class="animal-info">
            <h3 id="animalName"></h3>
            <p id="animalDesc"></p>

            <audio controls id="audioPlayer">
              <source id="audioSource" src="" type="audio/mp3">
            </audio>

          </div>
        </div>

      </div>

    </div>

    <div class="footer">
      Relax your mind with nature and animal healing sounds 🌿
    </div>

  </div>

  <script>

    function checkStress(){

      let q1 = parseInt(document.getElementById("q1").value);
      let q2 = parseInt(document.getElementById("q2").value);
      let q3 = parseInt(document.getElementById("q3").value);

      let total = q1 + q2 + q3;

      let stressText = document.getElementById("stressText");
      let animalImg = document.getElementById("animalImg");
      let animalName = document.getElementById("animalName");
      let animalDesc = document.getElementById("animalDesc");
      let result = document.getElementById("result");

      result.style.display = "block";

      if(total <= 4){

        stressText.innerHTML = "Your Stress Level is LOW 😊";

        animalImg.src = "https://images.unsplash.com/photo-1517849845537-4d257902454a";

        animalName.innerHTML = "Cat Purring Sound";

        animalDesc.innerHTML =
        "Cat purring sounds help calm the brain, reduce anxiety, and create peaceful feelings.";

      }

      else if(total <= 7){

        stressText.innerHTML = "Your Stress Level is MEDIUM 😌";

        animalImg.src = "https://images.unsplash.com/photo-1507525428034-b723cf961d3e";

        animalName.innerHTML = "Dolphin Ocean Sound";

        animalDesc.innerHTML =
        "Dolphin and ocean sounds help improve mood, reduce stress, and relax the mind.";

      }

      else{

        stressText.innerHTML = "Your Stress Level is HIGH 😟";

        animalImg.src = "https://images.unsplash.com/photo-1474511320723-9a56873867b5";

        animalName.innerHTML = "Bird Forest Sound";

        animalDesc.innerHTML =
        "Soft bird sounds and forest ambience help reduce mental pressure and improve sleep.";

      }

    }

  </script>

</body>
</html>
